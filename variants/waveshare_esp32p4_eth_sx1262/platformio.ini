  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D USE_ETHERNET
  -D ETH_STATIC_IP=192,168,254,21
  -D ETH_GATEWAY=192,168,254,254
  -D ETH_SUBNET=255,255,255,0
  -D ETH_DNS=8,8,8,8
