; Waveshare ESP32-P4-ETH + SX1262 LoRa variant
;
; Hardware:
;   SoC:     ESP32-P4NRW32 (dual-core RISC-V 360 MHz, 32 MB PSRAM in-package)
;   ETH:     IP101GRI via native RMII EMAC (NOT SPI/W5500, NOT ETHClass2)
;   LoRa:    SX1262 on GP-SPI3 (GPIO Matrix)
;
[Waveshare_ESP32P4_ETH_SX1262]
extends = esp32_base
; Same pioarduino 53.03.13-1 URL used by esp32c6_base — already cached locally.
; arduino-esp32 3.1.3 (official espressif release) + RISC-V GCC 13.2.0.
; Do NOT use "platformio/espressif32@53.03.13": PlatformIO semver rejects leading
; zeros in version components ('03', '13'), causing SemanticVersionError at parse time.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = esp32-p4
upload_protocol = esptool
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
  ${esp32_base.build_flags}
  -D BOARD_HAS_PSRAM
  -I variants/waveshare_esp32p4_eth_sx1262
  -D WAVESHARE_ESP32P4_ETH_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  ; SX1262 pins (GP-SPI3 via GPIO Matrix)
  -D P_LORA_MOSI=17
  -D P_LORA_MISO=16
  -D P_LORA_SCLK=18
  -D P_LORA_NSS=19
  -D P_LORA_DIO_1=14
  -D P_LORA_BUSY=15
  -D P_LORA_RESET=22
  ; Ethernet RMII (IP101GRI PHY, native EMAC)
  -D ETH_PHY_ADDR=0
  -D ETH_MDC_GPIO=31
  -D ETH_MDIO_GPIO=52
  -D ETH_PHY_RST_GPIO=51

build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/waveshare_esp32p4_eth_sx1262>
  +<helpers/esp32/ESP32P4EthBoard.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>

[env:Waveshare_ESP32P4_ETH_SX1262_repeater]
extends = Waveshare_ESP32P4_ETH_SX1262
build_flags =
  ${Waveshare_ESP32P4_ETH_SX1262.build_flags}
  -D ADVERT_NAME='"ESP32-P4 SX1262 Repeater"'
  -D ADVERT_LAT=0
  -D ADVERT_LON=0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Waveshare_ESP32P4_ETH_SX1262.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Waveshare_ESP32P4_ETH_SX1262.lib_deps}
  ${esp32_ota.lib_deps}

[env:Waveshare_ESP32P4_ETH_SX1262_repeater_eth]
extends = Waveshare_ESP32P4_ETH_SX1262
build_flags =
  ${Waveshare_ESP32P4_ETH_SX1262.build_flags}
  -D ADVERT_NAME='"ESP32-P4 SX1262 Repeater ETH"'
  -D ADVERT_LAT=0
  -D ADVERT_LON=0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D USE_ETHERNET
  -D ETH_STATIC_IP=192,168,254,21
  -D ETH_GATEWAY=192,168,254,254
  -D ETH_SUBNET=255,255,255,0
  -D ETH_DNS=8,8,8,8
  -D TCP_CONSOLE_PORT=4242
build_src_filter = ${Waveshare_ESP32P4_ETH_SX1262.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Waveshare_ESP32P4_ETH_SX1262.lib_deps}
  ${esp32_ota.lib_deps}

